apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: user-service-staging
  namespace: argocd

spec:
  project: microservices

  source:
    repoURL: https://github.com/iampratik11/k8s-gitops-platform.git
    targetRevision: main
    path: helm/user-service

    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
