apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: payment-service-production
  namespace: argocd

spec:
  project: microservices

  source:
    repoURL: https://github.com/iampratik11/k8s-gitops-platform.git
    targetRevision: main
    path: helm/payment-service

    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
